name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Canonical gates (terminology, contrast)
        run: |
          python3 docs/stage-0/scripts/terminology_gate.py
          python3 docs/stage-0/scripts/contrast_check.py
      - name: Seed matches glossary (single source of names)
        run: npm run seed:gen && git diff --exit-code supabase/seed.sql
      - name: Lint and typecheck
        run: npm run lint && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Start ephemeral Supabase (test DB, T-1)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,mailpit
      - name: Export ephemeral Supabase env (local keys of the throwaway CI instance)
        run: |
          npx supabase status -o env             --override-name api.url=NEXT_PUBLIC_SUPABASE_URL             --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY             --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY             | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' | sed 's/"//g' >> "$GITHUB_ENV"
          echo "E2E_OWNER_EMAIL=owner@e2e.local" >> "$GITHUB_ENV"
          echo "E2E_OWNER_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Migrations on empty database
        run: npx supabase db reset
      - name: Database tests (pgTAP)
        run: npx supabase test db
      - name: Build
        run: npm run build
      - name: No secrets in the browser bundle (18D §56)
        run: node scripts/check-bundle-secrets.mjs
      - name: E2E (auth, RTL, mobile 320)
        run: npx playwright install --with-deps chromium && npx playwright test
